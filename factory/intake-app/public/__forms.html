<!doctype html>
<html>
  <head><title>Netlify Forms detection — site-intake</title></head>
  <body>
    <!-- Static mirror of the React intake form so Netlify's build bot registers it.
         The app POSTs url-encoded data to /__forms.html at runtime. -->
    <form name="site-intake" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="brandName" />
      <input type="text" name="legalName" />
      <input type="email" name="email" />
      <input type="text" name="phoneDigits" />
      <input type="text" name="city" />
      <input type="text" name="state" />
      <input type="text" name="domain" />
      <input type="text" name="theme" />
      <input type="text" name="design" />
      <textarea name="payload"></textarea>
    </form>
  </body>
</html>
